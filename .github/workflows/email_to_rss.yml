name: "Email -> RSS"

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  generate-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Setup Python 3.12
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: pip install msal requests

      - name: "Recuperation emails & generation RSS"
        env:
          AZURE_CLIENT_ID:   ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID:   ${{ secrets.AZURE_TENANT_ID }}
          MS_REFRESH_TOKEN: ${{ secrets.MS_REFRESH_TOKEN }}
          SENDER_FILTER:    ${{ secrets.SENDER_FILTER }}
          PAGES_URL:        ${{ secrets.PAGES_URL }}
          MAX_ITEMS:        "100"
        run: python fetch_and_generate_rss.py

      - name: "Commit & push du flux RSS"
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/feed.xml docs/history.json
          git diff --cached --quiet || git commit -m "Mise a jour flux RSS $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
