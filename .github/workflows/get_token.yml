name: Get OAuth Token (Device Code Flow)

on:
  workflow_dispatch:

jobs:
  get-token:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install msal PyNaCl requests

      - name: Run device code flow and save token
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'EOF'
          import msal, json, os, sys, base64, requests
          from nacl import encoding, public

          CLIENT_ID = os.environ["AZURE_CLIENT_ID"]
          GH_TOKEN  = os.environ["GH_TOKEN"]
          GH_REPO   = os.environ["GH_REPO"]
          SCOPES    = ["https://graph.microsoft.com/Mail.Read"]

          app = msal.PublicClientApplication(
              CLIENT_ID,
              authority="https://login.microsoftonline.com/common",
          )

          flow = app.initiate_device_flow(scopes=SCOPES)
          if "user_code" not in flow:
              print("ERROR:", json.dumps(flow, indent=2))
              sys.exit(1)

          print("\n" + "="*60)
          print("ACTION REQUISE - Ouvrez ce lien dans votre navigateur:")
          print(flow["verification_uri"])
          print(f"Entrez ce code: {flow['user_code']}")
          print("="*60 + "\n")
          sys.stdout.flush()

          result = app.acquire_token_by_device_flow(flow)

          if "refresh_token" not in result:
              print("ERREUR:", json.dumps(result, indent=2))
              sys.exit(1)

          rt = result["refresh_token"]
          print(f"Token obtenu ({len(rt)} chars) - Sauvegarde dans le secret GitHub...")

          # Get repo public key for secret encryption
          headers = {
              "Authorization": f"Bearer {GH_TOKEN}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          key_resp = requests.get(
              f"https://api.github.com/repos/{GH_REPO}/actions/secrets/public-key",
              headers=headers,
          )
          key_resp.raise_for_status()
          key_data = key_resp.json()
          key_id   = key_data["key_id"]
          pub_key  = public.PublicKey(key_data["key"].encode(), encoding.Base64Encoder())
          sealed   = public.SealedBox(pub_key).encrypt(rt.encode())
          encrypted = base64.b64encode(sealed).decode()

          # Update secret
          put_resp = requests.put(
              f"https://api.github.com/repos/{GH_REPO}/actions/secrets/MS_REFRESH_TOKEN",
              headers=headers,
              json={"encrypted_value": encrypted, "key_id": key_id},
          )
          if put_resp.status_code in (201, 204):
              print("SUCCES: Secret MS_REFRESH_TOKEN mis a jour automatiquement!")
          else:
              print(f"ERREUR mise a jour secret: {put_resp.status_code} {put_resp.text}")
              sys.exit(1)
          EOF
