name: Get OAuth Token (Device Code Flow)

on:
  workflow_dispatch:

jobs:
  get-token:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install msal PyNaCl requests

      - name: Run device code flow
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          python3 - <<'EOF'
          import msal, json, os, sys

          CLIENT_ID = os.environ["AZURE_CLIENT_ID"]
          SCOPES    = ["https://graph.microsoft.com/Mail.Read"]

          app = msal.PublicClientApplication(
              CLIENT_ID,
              authority="https://login.microsoftonline.com/common",
          )

          flow = app.initiate_device_flow(scopes=SCOPES)
          if "user_code" not in flow:
              print("ERROR:", json.dumps(flow, indent=2))
              sys.exit(1)

          print("\n" + "="*60)
          print("ACTION REQUISE - Ouvrez ce lien dans votre navigateur:")
          print(flow["verification_uri"])
          print(f"Entrez ce code: {flow['user_code']}")
          print("="*60 + "\n")
          sys.stdout.flush()

          result = app.acquire_token_by_device_flow(flow)

          print("[DEBUG] Keys:", list(result.keys()), file=sys.stderr)

          if "refresh_token" not in result:
              print("ERREUR: pas de refresh_token. Keys:", list(result.keys()))
              print(json.dumps({k:v for k,v in result.items() if k!='access_token'}, indent=2))
              sys.exit(1)

          rt = result["refresh_token"]
          # Write to file (will be read by next step)
          with open("/tmp/rt.txt", "w") as f:
              f.write(rt)
          print(f"[OK] Refresh token saved ({len(rt)} chars)")
          EOF

      - name: Update GitHub secret with GH CLI
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          RT=$(cat /tmp/rt.txt)
          gh secret set MS_REFRESH_TOKEN --body "$RT" --repo ${{ github.repository }}
          echo "[OK] Secret MS_REFRESH_TOKEN updated successfully!"
          rm /tmp/rt.txt
